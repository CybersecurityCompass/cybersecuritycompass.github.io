<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Cybersecurity Compass</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:#000;height:100%;}
@keyframes waveDrift{from{background-position:0 0,0 0;}to{background-position:1200px 0,-900px 0;}}
@keyframes hazeFloat{0%{transform:translate3d(-2%,0,0) scale(1.05);}50%{transform:translate3d(2%,-1%,0) scale(1.09);}100%{transform:translate3d(-2%,0,0) scale(1.05);}}
#wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;}
#stage{position:relative;width:min(96vw,96vh);aspect-ratio:1/1;overflow:hidden;background:#0a0c0e;border-radius:6px;box-shadow:0 30px 80px rgba(0,0,0,.6);}
.bg1{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 16%,#22262c 0%,#14171b 38%,#0a0c0e 70%,#050607 100%);}
.bg2{position:absolute;inset:0;opacity:.55;background:linear-gradient(180deg,rgba(40,46,54,0) 42%,rgba(58,68,80,.22) 72%,rgba(7,9,11,.92) 100%);}
.bg3{position:absolute;left:-10%;top:-12%;width:120%;height:66%;opacity:.4;background:radial-gradient(60% 80% at 30% 40%,rgba(124,134,144,.18),transparent 60%),radial-gradient(50% 70% at 76% 28%,rgba(92,102,112,.16),transparent 60%);animation:hazeFloat 26s ease-in-out infinite;}
.bg4{position:absolute;left:0;right:0;bottom:0;height:48%;opacity:.16;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 2px,transparent 2px 9px),repeating-linear-gradient(90deg,rgba(255,255,255,.045) 0 1px,transparent 1px 14px);background-size:1200px 100%,900px 100%;animation:waveDrift 18s linear infinite;mix-blend-mode:screen;}
.bg5{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(4,5,7,.62) 32%,rgba(4,5,7,.2) 56%,rgba(4,5,7,0) 70%);}
#compass-svg{position:absolute;inset:0;width:100%;height:100%;display:block;}
/* UI overlays */
#lang-bar{position:absolute;top:10px;right:10px;z-index:100;display:flex;gap:4px;align-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:4px 6px;}
#lang-bar button{padding:3px 9px;border-radius:5px;border:none;cursor:pointer;font-weight:600;font-size:10px;font-family:Inter,system-ui,sans-serif;transition:all .2s;letter-spacing:.04em;}
#compass-title{position:absolute;top:12px;left:14px;z-index:100;font-family:Inter,Arial,sans-serif;font-size:clamp(16px,3.2vmin,35px);font-weight:600;color:#fff;letter-spacing:.2px;pointer-events:none;}
#credit{position:absolute;bottom:10px;left:12px;z-index:100;font-family:Inter,Arial,sans-serif;font-size:9px;color:rgba(255,255,255,.35);letter-spacing:.04em;line-height:1.6;pointer-events:auto;}
#pub-link{position:absolute;bottom:10px;right:12px;z-index:100;font-family:Inter,Arial,sans-serif;font-size:8px;color:rgba(255,255,255,.35);letter-spacing:.03em;line-height:1.6;text-align:right;max-width:52%;pointer-events:auto;}
/* Tooltip */
#tt{position:absolute;pointer-events:none;z-index:300;opacity:0;transition:opacity .2s ease;width:285px;background:rgba(8,10,12,.94);border:1px solid rgba(255,255,255,.13);border-radius:10px;padding:14px 16px;backdrop-filter:blur(12px);}
#tt.on{opacity:1;}
#tt-h{font-family:Inter,Arial,sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#E01C24;margin-bottom:4px;}
#tt-s{font-family:Inter,Arial,sans-serif;font-size:9px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:rgba(255,255,255,.38);margin-bottom:10px;}
#tt-b{font-family:Inter,Arial,sans-serif;font-size:11px;line-height:1.7;color:rgba(255,255,255,.78);}
/* Hit areas */
#hits{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:50;cursor:default;}
#hits path{pointer-events:all;cursor:pointer;fill:transparent;}
</style>
</head>

const TT={
  en:[
    {h:"Cyber Risk Management",s:"Before a Breach · Proactive & Predictive",

    {h:"Detection and Response",s:"During a Breach · Reactive & Defensive",

  de:[
    {h:"Cyber-Risikomanagement",s:"Vor einem Sicherheitsvorfall · Proaktiv und Vorausschauend",
     b:"Der wahre Norden Ihres Cybersicherheits-Kompasses. Ohne ihn treiben Organisationen von Krise zu Krise, reagieren, erholen sich, ohne das Risiko jemals wirklich zu senken. Cyber-Risikomanagement ist die proaktive und vorausschauende Disziplin, die Bedrohungen erkennt, bevor sie eintreten, das Wichtigste priorisiert, Sicherheitsinvestitionen optimiert und Führungskräften eine klare Sprache für strategische Entscheidungen gibt. Cyberkriminelle suchen nicht nur nach technischen Schwachstellen. Sie suchen die Unsicherheit und Unentschlossenheit, die entsteht, wenn kein Norden vorhanden ist. Genau das schließt diese Lücke."},
    {h:"Erkennung und Reaktion",s:"Während eines Sicherheitsvorfalls · Reaktiv und Defensiv",

  ja:[
    {h:"サイバーリスクマネジメント",s:"侵害前・プロアクティブかつ予測的",
     b:"サイバーセキュリティ・コンパスの真北。これがなければ、組織は危機から危機へと漂流し、対応と復旧を繰り返すだけで、リスクを本質的に減らすことは決してない。サイバーリスクマネジメントは、脅威が現実化する前に予測し、最も重要な事項を優先し、セキュリティ投資を最適化し、経営層が戦略的な意思決定を行うための明確な言語を提供する、プロアクティブかつ予測的な規律だ。サイバー犯罪者が狙っているのは技術的な脆弱性だけではない。真北を持たないことから生まれる不確実性と迷いこそが、彼らの標的だ。これを埋めるのがこの規律である。"},
    {h:"検知と対応",s:"侵害中・リアクティブかつ防御的",

  ar:[
    {h:"إدارة المخاطر السيبرانية",s:"قبل الاختراق · استباقي واستشرافي",
     b:"الشمال الحقيقي لبوصلة الأمن السيبراني في مؤسستك. بدونها، تنجرف المؤسسات من أزمة إلى أزمة، فتتفاعل وتتعافى، دون أن تُخفّض المخاطر فعليًا في أي وقت. إدارة المخاطر السيبرانية هي المنهجية الاستباقية والاستشرافية التي تستشرف التهديدات قبل أن تتجسّد، وتُرتّب الأولويات بحسب الأهمية الحقيقية، وتُحسّن استثمارات الأمن، وتمنح القيادات التنفيذية لغة واضحة لاتخاذ القرارات الاستراتيجية. المجرمون السيبرانيون لا يبحثون فقط عن الثغرات التقنية. بل يبحثون عن حالة عدم اليقين والتردد الناتجة عن غياب هذا الشمال. وهذا بالضبط ما يُغلق تلك الفجوة."},
    {h:"الكشف والاستجابة",s:"خلال الاختراق · تفاعلي ودفاعي",
     b:"في الأمن السيبراني، لا يتعلق الأمر بما إذا كانت العاصفة ستضرب، بل بمتى ستضرب. الكشف والاستجابة هو طاقمك في قلب العاصفة: أعين مركّزة على كل إشارة، وأيدٍ على كل عنصر تحكم. فهو يحدد التهديدات لحظة ظهورها، ويحتوي الاختراق قبل أن ينتشر، ويستجيب بسرعة ودقة. أساسي، لكنه لا يكفي وحده أبدًا. المؤسسات التي لا تعرف سوى مواجهة العواصف ستقضي رحلتها كاملة في انتظار العاصفة التالية. البوصلة تتطلب أكثر من ذلك."},
    {h:"المرونة السيبرانية",s:"بعد الاختراق · التعافي والتحسين · نتيجة واحدة",

  ],
  zh:[
    {h:"网络风险管理",s:"入侵前 · 主动预测",
     b:"这是你的网络安全指南针真正指向的方向。没有它，组织只能在一次次危机中挣扎，不断应对、不断恢复，却始终无法真正降低风险。网络风险管理是一种主动且预测性的方法论，它在威胁尚未成形之前就提前识别，把资源优先投向真正重要的地方，优化安全投入，并为管理层提供清晰的语言来做出战略决策。网络犯罪分子寻找的不仅是技术上的漏洞，他们更在寻找因缺乏方向而产生的不确定和犹豫。而这正是网络风险管理要填补的缺口。"},
    {h:"检测与响应",s:"入侵中 · 被动防御",
     b:"在网络安全领域，问题从来不是风暴会不会来，而是什么时候来。检测与响应就是你在风暴中心的团队：眼睛盯住每一个信号，双手随时准备操作每一个控制点。它能在威胁刚刚显现时就识别出来，在入侵扩散之前将其遏制，并以速度和精准做出响应。它至关重要，但从来不足以单独依靠。那些只懂得硬扛风暴的组织，会把整段航程都耗在等待下一场风暴上。指南针要求的，远不止于此。"},
    {h:"网络韧性",s:"入侵后 · 恢复与改进 · 一种结果",
     b:"网络韧性不是发生事件之后才进入的一个阶段，而是把其他所有环节都做对之后自然产生的结果。当你的方向由主动的风险管理确定，你的团队又能在风暴中精准应对，韧性就是你所获得的回报。它意味着更快恢复运营，从失败中学习，加固已经暴露的部分，并把这些经验重新反馈进你的指南针。真正实现网络韧性的组织，不只是在风暴中存活下来，而是每经历一次风暴，就变得更难被击沉。"}

const TTP={
  en:[
    {h:"People",s:"The Human Layer",
     b:"Technology does not defend organizations. People do. The People dimension of the compass represents the human layer that makes every other investment meaningful: the security analysts who interpret signals, the executives who make risk decisions, the employees who are either the first line of defense or the first point of failure. And on the other side of every attack, there is also a person. Cybercriminals are not automated forces of nature. They are individuals with intentions, motivations, and strategies of their own. They study their targets, exploit indecision, and move with purpose. Defending against them requires the same human qualities they possess: awareness, judgment, and the will to act before they do. A compass without skilled, aware, and empowered people is an instrument no one knows how to read. Culture, training, accountability, and leadership are not soft factors. They are the hands on the wheel."},
    {h:"Process",s:"The Operational Backbone",
     b:"Process is the operational backbone that connects people to technology and strategy to execution. Without it, even the best tools produce noise, and even the best talent operates in silos. At the core of a mature process layer sit the CyberRiskOps discipline and its operational nerve center, the Cyber Risk Operations Center (CROC), where risk intelligence is continuously measured, prioritized, and acted upon. Security Operations (SecOps) bridges that risk intelligence with real-time action, while the Security Operations Center (SOC) executes detection, investigation, and response at speed. Together, they transform cybersecurity from a set of isolated reactions into a continuous, measurable, and improving operation. Process is what ensures the compass keeps moving."},
    {h:"Technology",s:"The Force Multiplier",
     b:"Technology is the force multiplier of your cybersecurity strategy, but only when it serves a clear purpose. Cyber Risk Quantification (CRQ) translates technical risk into financial language that executives can act on. Cyber Risk Exposure Management (CREM) continuously maps and prioritizes your attack surface before adversaries can exploit it. Extended Detection and Response (XDR) unifies visibility across endpoints, networks, cloud, and identity into a single, correlated picture. Threat Intelligence feeds your compass with adversary context, turning reactive alerts into proactive decisions. Automation eliminates the manual friction that slows response and allows your teams to operate at machine speed without burning out. A unified platform ties all of this together, replacing fragmented point solutions with integrated intelligence. Artificial Intelligence extends what human teams can do across every layer. Technology does not define your strategy. It executes it."}
  ],
  es:[
    {h:"Personas",s:"La Capa Humana",
     b:"La tecnología no defiende organizaciones. Las personas sí. La dimensión de Personas representa la capa humana que da sentido a cada otra inversión: los analistas que interpretan señales, los ejecutivos que toman decisiones de riesgo, los empleados que son la primera línea de defensa o el primer punto de falla. Y al otro lado de cada ataque también hay una persona. Los ciberdelincuentes no son fuerzas automatizadas de la naturaleza. Son individuos con intenciones, motivaciones y estrategias propias. Estudian sus objetivos, explotan la indecisión y actúan con propósito. Defenderse de ellos requiere las mismas cualidades humanas que ellos poseen: conciencia, juicio y voluntad de actuar antes que ellos. Una brújula sin personas capacitadas y empoderadas es un instrumento que nadie sabe leer. La cultura, la formación, la responsabilidad y el liderazgo no son factores blandos. Son las manos en el timón."},
    {h:"Procesos",s:"La Columna Vertebral Operacional",
     b:"El proceso es la columna vertebral operacional que conecta a las personas con la tecnología y la estrategia con la ejecución. Sin él, incluso las mejores herramientas generan ruido y el mejor talento opera en silos. En el núcleo de una capa de proceso madura se encuentran la disciplina CyberRiskOps y su centro neurálgico operacional, el Centro de Operaciones de Ciber Riesgo (CROC), donde la inteligencia de riesgo se mide, prioriza y actúa continuamente. Security Operations (SecOps) conecta esa inteligencia de riesgo con la acción en tiempo real, mientras que el Centro de Operaciones de Seguridad (SOC) ejecuta la detección, investigación y respuesta con velocidad. Juntos, transforman la ciberseguridad de un conjunto de reacciones aisladas en una operación continua, medible y en mejora constante. El proceso es lo que garantiza que la brújula siga en movimiento."},
    {h:"Tecnología",s:"El Multiplicador de Fuerza",
     b:"La tecnología es el multiplicador de fuerza de tu estrategia de ciberseguridad, pero solo cuando sirve a un propósito claro. La Cuantificación del Ciber Riesgo (CRQ) traduce el riesgo técnico a un lenguaje financiero que los ejecutivos pueden utilizar. La Gestión de Exposición al Ciber Riesgo (CREM) mapea y prioriza continuamente tu superficie de ataque antes de que los adversarios puedan explotarla. La Detección y Respuesta Extendida (XDR) unifica la visibilidad en endpoints, redes, nube e identidad en una imagen única y correlacionada. La Inteligencia de Amenazas alimenta tu brújula con contexto del adversario, convirtiendo alertas reactivas en decisiones proactivas. La automatización elimina la fricción manual que ralentiza la respuesta y permite a tus equipos operar a la velocidad de las máquinas. Una plataforma unificada integra todo esto, reemplazando soluciones puntuales fragmentadas con inteligencia integrada. La Inteligencia Artificial amplía lo que los equipos humanos pueden hacer en cada capa. La tecnología no define tu estrategia. La ejecuta."}
  ],
  pt:[
    {h:"Pessoas",s:"A Camada Humana",
     b:"A tecnologia não defende organizações. As pessoas sim. A dimensão de Pessoas representa a camada humana que dá sentido a cada outro investimento: os analistas que interpretam sinais, os executivos que tomam decisões de risco, os funcionários que são a primeira linha de defesa ou o primeiro ponto de falha. E do outro lado de cada ataque também há uma pessoa. Os cibercriminosos não são forças automatizadas da natureza. São indivíduos com intenções, motivações e estratégias próprias. Estudam seus alvos, exploram a indecisão e agem com propósito. Defendê-los exige as mesmas qualidades humanas que eles possuem: consciência, julgamento e vontade de agir antes deles. Uma bússola sem pessoas capacitadas e empoderadas é um instrumento que ninguém sabe ler. Cultura, treinamento, responsabilidade e liderança não são fatores suaves. São as mãos no leme."},
    {h:"Processos",s:"A Espinha Dorsal Operacional",
     b:"O processo é a espinha dorsal operacional que conecta pessoas à tecnologia e estratégia à execução. Sem ele, até as melhores ferramentas geram ruído e o melhor talento opera em silos. No núcleo de uma camada de processo madura estão a disciplina CyberRiskOps e seu centro operacional, o Centro de Operações de Ciber Risco (CROC), onde a inteligência de risco é continuamente medida, priorizada e executada. Security Operations (SecOps) conecta essa inteligência de risco com ação em tempo real, enquanto o Centro de Operações de Segurança (SOC) executa detecção, investigação e resposta com velocidade. Juntos, transformam a cibersegurança de um conjunto de reações isoladas em uma operação contínua, mensurável e em melhoria constante. O processo é o que garante que a bússola continue em movimento."},
    {h:"Tecnologia",s:"O Multiplicador de Força",
     b:"A tecnologia é o multiplicador de força da sua estratégia de cibersegurança, mas apenas quando serve a um propósito claro. A Quantificação do Ciber Risco (CRQ) traduz o risco técnico em linguagem financeira que os executivos podem utilizar. A Gestão de Exposição ao Ciber Risco (CREM) mapeia e prioriza continuamente sua superfície de ataque antes que os adversários possam explorá-la. A Detecção e Resposta Estendida (XDR) unifica a visibilidade em endpoints, redes, nuvem e identidade em uma imagem única e correlacionada. A Inteligência de Ameaças alimenta sua bússola com contexto do adversário, transformando alertas reativos em decisões proativas. A automação elimina o atrito manual que atrasa a resposta e permite que suas equipes operem na velocidade das máquinas. Uma plataforma unificada integra tudo isso, substituindo soluções pontuais fragmentadas por inteligência integrada. A Inteligência Artificial amplia o que as equipes humanas podem fazer em cada camada. A tecnologia não define sua estratégia. Ela a executa."}
  ],
  fr:[
    {h:"Personnes",s:"La Couche Humaine",
     b:"La technologie ne défend pas les organisations. Les personnes, si. La dimension Personnes de la boussole représente la couche humaine qui donne un sens à chaque autre investissement : les analystes de sécurité qui interprètent les signaux, les dirigeants qui prennent les décisions de risque, les employés qui constituent soit la première ligne de défense, soit le premier point de défaillance. Et de l'autre côté de chaque attaque, il y a aussi une personne. Les cybercriminels ne sont pas des forces automatisées de la nature. Ce sont des individus avec leurs propres intentions, motivations et stratégies. Ils étudient leurs cibles, exploitent l'indécision et agissent avec un objectif précis. Se défendre contre eux exige les mêmes qualités humaines qu'ils possèdent : la vigilance, le jugement et la volonté d'agir avant eux. Une boussole sans personnes compétentes, vigilantes et responsabilisées est un instrument que personne ne sait lire. La culture, la formation, la responsabilisation et le leadership ne sont pas des facteurs secondaires. Ce sont les mains sur le gouvernail."},
    {h:"Processus",s:"L'Épine Dorsale Opérationnelle",
     b:"Le processus est l'épine dorsale opérationnelle qui relie les personnes à la technologie et la stratégie à l'exécution. Sans lui, même les meilleurs outils produisent du bruit, et même les meilleurs talents opèrent en silos. Au cœur d'une couche de processus mature se trouvent la discipline CyberRiskOps et son centre névralgique opérationnel, le Centre des Opérations de Cyber Risque (CROC), où l'intelligence du risque est mesurée, priorisée et exploitée en continu. Security Operations (SecOps) relie cette intelligence du risque à l'action en temps réel, tandis que le Security Operations Center (SOC) exécute la détection, l'investigation et la réponse avec rapidité. Ensemble, ils transforment la cybersécurité d'un ensemble de réactions isolées en une opération continue, mesurable et en amélioration constante. Le processus est ce qui garantit que la boussole continue d'avancer."},
    {h:"Technologie",s:"Le Multiplicateur de Force",
     b:"La technologie est le multiplicateur de force de votre stratégie de cybersécurité, mais seulement lorsqu'elle sert un objectif clair. La Quantification du Cyber Risque (CRQ) traduit le risque technique en un langage financier que les dirigeants peuvent exploiter. La Gestion de l'Exposition au Cyber Risque (CREM) cartographie et priorise en continu votre surface d'attaque avant que les adversaires ne puissent l'exploiter. La Détection et Réponse Étendues (XDR) unifie la visibilité sur les terminaux, les réseaux, le cloud et l'identité en une image unique et corrélée. Le Renseignement sur les Menaces alimente votre boussole avec le contexte de l'adversaire, transformant les alertes réactives en décisions proactives. L'automatisation élimine la friction manuelle qui ralentit la réponse et permet à vos équipes d'opérer à la vitesse de la machine sans s'épuiser. Une plateforme unifiée relie tout cela, remplaçant les solutions ponctuelles fragmentées par une intelligence intégrée. L'Intelligence Artificielle étend ce que les équipes humaines peuvent accomplir à chaque niveau. La technologie ne définit pas votre stratégie. Elle l'exécute."}
  ],
  de:[
    {h:"Menschen",s:"Die menschliche Ebene",
     b:"Technologie verteidigt keine Organisationen. Menschen tun das. Die Dimension Menschen des Kompasses steht für die menschliche Ebene, die jede andere Investition sinnvoll macht: die Sicherheitsanalysten, die Signale interpretieren, die Führungskräfte, die Risikoentscheidungen treffen, die Mitarbeiter, die entweder die erste Verteidigungslinie oder der erste Schwachpunkt sind. Und auf der anderen Seite jedes Angriffs steht ebenfalls ein Mensch. Cyberkriminelle sind keine automatisierten Naturkräfte. Es sind Individuen mit eigenen Absichten, Motivationen und Strategien. Sie studieren ihre Ziele, nutzen Unentschlossenheit aus und handeln mit Zielstrebigkeit. Sich gegen sie zu verteidigen erfordert dieselben menschlichen Qualitäten, die sie besitzen: Wachsamkeit, Urteilsvermögen und den Willen, vor ihnen zu handeln. Ein Kompass ohne kompetente, wachsame und befähigte Menschen ist ein Instrument, das niemand zu lesen weiß. Kultur, Training, Verantwortlichkeit und Führung sind keine weichen Faktoren. Sie sind die Hände am Steuer."},
    {h:"Prozess",s:"Das operative Rückgrat",
     b:"Prozess ist das operative Rückgrat, das Menschen mit Technologie und Strategie mit Umsetzung verbindet. Ohne ihn erzeugen selbst die besten Werkzeuge nur Lärm, und selbst die besten Talente arbeiten in Silos. Im Kern einer ausgereiften Prozessebene stehen die CyberRiskOps-Disziplin und ihr operatives Nervenzentrum, das Cyber-Risiko-Operationszentrum (CROC), in dem Risikoerkenntnisse kontinuierlich gemessen, priorisiert und umgesetzt werden. Security Operations (SecOps) verbindet diese Risikoerkenntnisse mit Echtzeit-Handeln, während das Security Operations Center (SOC) Erkennung, Untersuchung und Reaktion mit Geschwindigkeit ausführt. Gemeinsam verwandeln sie Cybersicherheit von einer Reihe isolierter Reaktionen in einen kontinuierlichen, messbaren und sich stetig verbessernden Betrieb. Prozess ist das, was sicherstellt, dass der Kompass sich weiterbewegt."},
    {h:"Technologie",s:"Der Kraftmultiplikator",
     b:"Technologie ist der Kraftmultiplikator Ihrer Cybersicherheitsstrategie, aber nur, wenn sie einem klaren Zweck dient. Cyber-Risikoquantifizierung (CRQ) übersetzt technisches Risiko in eine finanzielle Sprache, mit der Führungskräfte handeln können. Cyber-Risiko-Expositionsmanagement (CREM) kartiert und priorisiert kontinuierlich Ihre Angriffsfläche, bevor Angreifer sie ausnutzen können. Erweiterte Erkennung und Reaktion (XDR) vereint die Sichtbarkeit über Endpunkte, Netzwerke, Cloud und Identität in einem einzigen, korrelierten Bild. Threat Intelligence versorgt Ihren Kompass mit Kontext über den Angreifer und verwandelt reaktive Warnungen in proaktive Entscheidungen. Automatisierung eliminiert die manuelle Reibung, die die Reaktion verlangsamt, und ermöglicht Ihren Teams, mit Maschinengeschwindigkeit zu arbeiten, ohne auszubrennen. Eine einheitliche Plattform verbindet all dies und ersetzt fragmentierte Einzellösungen durch integrierte Intelligenz. Künstliche Intelligenz erweitert, was menschliche Teams auf jeder Ebene leisten können. Technologie definiert nicht Ihre Strategie. Sie setzt sie um."}
  ],
  ja:[
    {h:"人材",s:"ヒューマンレイヤー",
     b:"テクノロジーは組織を守らない。守るのは人材だ。コンパスにおける人材の次元は、他のすべての投資を意味あるものにするヒューマンレイヤーを表す。信号を解釈するセキュリティアナリスト、リスクの意思決定を行う経営層、防御の最前線にも最初の破綻点にもなり得る従業員たちだ。そして、あらゆる攻撃の反対側にも、やはり人がいる。サイバー犯罪者は自動化された自然の力ではない。彼ら自身の意図、動機、戦略を持つ個人だ。彼らはターゲットを研究し、迷いを突き、目的を持って動く。彼らに対抗するには、彼らが持つのと同じ人間的な資質、すなわち警戒心、判断力、そして彼らより先に行動する意志が求められる。スキルと意識と権限を備えた人材のいないコンパスは、誰も読み方を知らない計器にすぎない。文化、トレーニング、アカウンタビリティ、そしてリーダーシップは、ソフトな要素ではない。それらは舵を握る手そのものだ。"},
    {h:"プロセス",s:"運用のバックボーン",
     b:"プロセスは、人材とテクノロジーをつなぎ、戦略と実行をつなぐ運用のバックボーンだ。これがなければ、最高のツールもノイズしか生まず、最高の人材もサイロの中で孤立して動くことになる。成熟したプロセスレイヤーの中核には、CyberRiskOpsという規律と、その運用上の神経中枢であるサイバーリスクオペレーションセンター(CROC)がある。ここでリスクインテリジェンスが継続的に測定され、優先順位付けされ、実行に移される。SecOpsはそのリスクインテリジェンスをリアルタイムのアクションへとつなぎ、SOC(セキュリティオペレーションセンター)は検知・調査・対応を高速に実行する。両者が連携することで、サイバーセキュリティは孤立した反応の集合体から、継続的で測定可能、そして常に改善され続ける運用へと変わる。プロセスこそが、コンパスを動かし続ける原動力だ。"},
    {h:"テクノロジー",s:"フォースマルチプライヤー",
     b:"テクノロジーは、サイバーセキュリティ戦略のフォースマルチプライヤーだ。ただし、明確な目的に応える場合に限る。CRQ(サイバーリスク定量化)は、技術的リスクを経営層が判断できる財務言語へと翻訳する。CREM(サイバーリスクエクスポージャーマネジメント)は、攻撃者に悪用される前に、攻撃対象領域を継続的にマッピングし、優先順位付けする。XDR(拡張検知・対応)は、エンドポイント、ネットワーク、クラウド、IDにわたる可視性を、単一の相関的なビューへと統合する。脅威インテリジェンスは、攻撃者のコンテキストをコンパスに供給し、リアクティブなアラートをプロアクティブな意思決定へと変える。オートメーションは対応を遅らせる手作業の摩擦を排除し、チームがバーンアウトすることなく、マシンスピードで動けるようにする。統合プラットフォームはこれらすべてをつなぎ、断片化したポイントソリューションを統合されたインテリジェンスへと置き換える。AI(人工知能)は、人間のチームができることを、あらゆる層で拡張する。テクノロジーは戦略を定義しない。それを実行するのだ。"}
  ],
  ar:[
    {h:"العنصر البشري",s:"الطبقة البشرية",
     b:"التقنية لا تحمي المؤسسات. الأفراد يفعلون ذلك. يمثّل بُعد العنصر البشري في البوصلة الطبقة البشرية التي تجعل كل استثمار آخر ذا معنى: محللو الأمن الذين يفسّرون الإشارات، والقيادات التنفيذية التي تتخذ قرارات المخاطر، والموظفون الذين يمثلون خط الدفاع الأول أو نقطة الفشل الأولى. وعلى الطرف الآخر من كل هجوم، يوجد أيضًا شخص. المجرمون السيبرانيون ليسوا قوى طبيعية آلية. بل هم أفراد يحملون نواياهم ودوافعهم واستراتيجياتهم الخاصة. يدرسون أهدافهم، ويستغلون التردد، ويتحركون بهدف واضح. والدفاع ضدهم يتطلب نفس الصفات البشرية التي يمتلكونها: الوعي، وسلامة الحكم، والإرادة على التحرك قبلهم. البوصلة بلا أفراد مؤهلين وواعين ومُخوَّلين هي أداة لا يعرف أحد كيف يقرأها. الثقافة والتدريب والمساءلة والقيادة ليست عوامل ثانوية. بل هي الأيدي التي تقبض على المقود."},
    {h:"العمليات",s:"العمود الفقري التشغيلي",
     b:"العمليات هي العمود الفقري التشغيلي الذي يربط الأفراد بالتقنية، والاستراتيجية بالتنفيذ. وبدونها، تُصدر حتى أفضل الأدوات ضجيجًا بلا فائدة، ويعمل أفضل الكفاءات في عزلة تامة. وفي جوهر طبقة العمليات الناضجة تقع منهجية CyberRiskOps ومركزها العصبي التشغيلي، وهو مركز عمليات المخاطر السيبرانية (CROC)، حيث تُقاس معلومات المخاطر وتُرتّب أولوياتها ويُتّخذ بشأنها إجراء بشكل مستمر. وتربط عمليات الأمن (SecOps) تلك المعلومات بالفعل اللحظي، بينما يُنفّذ مركز عمليات الأمن (SOC) الكشف والتحقيق والاستجابة بسرعة عالية. ومعًا، يُحوّلان الأمن السيبراني من مجموعة ردود فعل منعزلة إلى عملية مستمرة وقابلة للقياس وفي تحسّن دائم. العمليات هي ما يضمن استمرار حركة البوصلة."},
    {h:"التقنية",s:"مُضاعِف القوة",
     b:"التقنية هي مُضاعِف القوة لاستراتيجية الأمن السيبراني في مؤسستك، ولكن فقط حين تخدم غرضًا واضحًا. يُترجم التقييم الكمي للمخاطر السيبرانية (CRQ) المخاطر التقنية إلى لغة مالية يمكن للقيادات التنفيذية التصرف بناءً عليها. وتقوم إدارة التعرض للمخاطر السيبرانية (CREM) برسم سطح الهجوم وترتيب أولوياته باستمرار قبل أن يتمكن الخصوم من استغلاله. ويوحّد الكشف والاستجابة الموسّعة (XDR) الرؤية عبر نقاط النهاية والشبكات والسحابة والهوية في صورة واحدة مترابطة. وتُغذّي استخبارات التهديدات بوصلتك بسياق الخصم، فتحوّل التنبيهات التفاعلية إلى قرارات استباقية. وتُزيل الأتمتة الاحتكاك اليدوي الذي يُبطّئ الاستجابة، وتتيح لفرقك العمل بسرعة الآلة دون الاحتراق الوظيفي. وتربط منصة موحّدة كل ذلك معًا، فتستبدل الحلول المجزّأة بذكاء متكامل. ويُوسّع الذكاء الاصطناعي ما يمكن للفرق البشرية تحقيقه على كل مستوى. التقنية لا تُحدّد استراتيجيتك. بل تُنفّذها."}
  ],
  zh:[
    {h:"人员",s:"人的层面",
     b:"技术不会保护组织，人才会。指南针中的人员维度，代表着让其他一切投入都变得有意义的人的层面：解读信号的安全分析师、做出风险决策的管理层，以及那些既可能是第一道防线，也可能是第一个失败点的员工。而在每一次攻击的另一端，同样站着一个人。网络犯罪分子不是自动运行的自然力量，而是拥有自己的意图、动机和策略的个体。他们研究目标、利用犹豫、带着明确的目的行动。要对抗他们，需要具备他们所拥有的同样的人的素质：警觉性、判断力，以及先于对手行动的意志。一个没有具备能力、保持警觉、被充分赋权的人员的指南针，只是一件没人知道该怎么读的仪器。文化、培训、问责和领导力，都不是可有可无的软性因素，而是真正握住方向盘的那双手。"},
    {h:"流程",s:"运营的支柱",
     b:"流程是连接人员与技术、连接战略与执行的运营支柱。没有它，再好的工具也只会产生噪音，再优秀的人才也只能在各自的信息孤岛中运转。在成熟的流程体系核心，是CyberRiskOps这一方法论，以及它的运营神经中枢——网络风险运营中心（CROC），在这里，风险情报被持续测量、排序并转化为行动。SecOps将这些风险情报与实时行动连接起来，而安全运营中心（SOC）则以高速执行检测、调查和响应。二者协同，把网络安全从一系列孤立的反应，转变为一个持续、可衡量、并不断改进的运营体系。流程，正是让指南针持续运转的力量。"},
    {h:"技术",s:"力量倍增器",
     b:"技术是你网络安全战略的力量倍增器，但前提是它要服务于一个明确的目标。网络风险量化（CRQ）把技术性风险，转化为管理层能够据此行动的财务语言。网络风险暴露面管理（CREM）持续绘制并排序你的攻击面，抢在对手利用它之前采取行动。扩展检测与响应（XDR）把终端、网络、云和身份的可见性，统一成一个单一、关联的视图。威胁情报为你的指南针提供对手的上下文，把被动的警报，转化为主动的决策。自动化消除了拖慢响应速度的人工摩擦，让团队能够以机器的速度运转，而不至于精力耗尽。统一平台把这一切连接在一起，用集成的情报取代碎片化的单点解决方案。人工智能则在每一个层面，放大人类团队所能做到的一切。技术不定义你的战略，它执行你的战略。"}
  ]
};

const IDS={crm:'t-crm',pap:'t-pap',bab:'t-bab',dar:'t-dar',rad:'t-rad',dub:'t-dub',cr:'t-cr',rai:'t-rai',aab:'t-aab',ppl:'t-ppl',prc:'t-prc',tch:'t-tch'};

let lang=(()=>{const n=(navigator.language||'en').slice(0,2).toLowerCase();return T[n]?n:'en';})();

function applyLang(l){
  lang=l;
  const t=T[l];
  Object.entries(IDS).forEach(([k,id])=>{
    const el=document.getElementById(id);
    if(el) el.textContent=t[k];
    else console.warn('Missing element:',id);
  });
  document.getElementById('compass-title').textContent=t.title;
  document.getElementById('credit').innerHTML=t.credit+'<br><a href="https://www.linkedin.com/in/jpcastro/" target="_blank" style="color:rgba(255,255,255,.5);text-decoration:none;">Juan Pablo Castro Vilaró</a>';
  // Line1 stays on its own line; line2 follows on same line if space allows,
  // otherwise breaks cleanly below line1 (never mid-word)
  document.getElementById('pub-link').innerHTML=
    '<a href="'+t.pubUrl+'" target="_blank" style="color:rgba(255,255,255,.45);text-decoration:none;display:block;margin-bottom:3px;">'+
      '<span style="display:inline;white-space:nowrap;">'+t.pubLine1+'</span> '+
      '<span style="display:inline;white-space:nowrap;">'+t.pubLine2+'</span>'+
    '</a>'+
    '<a href="'+t.pubDoiUrl+'" target="_blank" style="color:rgba(255,255,255,.28);text-decoration:none;">DOI: '+t.pubDoi+'</a>';
  ['en','es','pt','fr','de','ja','ar','zh'].forEach(c=>{
    const b=document.getElementById('btn-'+c);
    b.style.background=c===l?'#E01C24':'rgba(255,255,255,0.1)';
    b.style.color=c===l?'#fff':'#888';
  });
  // Arabic is RTL. Flip direction and alignment on the text containers
  // only (not the whole layout) and drop letter-spacing, which breaks
  // Arabic's cursive letter-joining if left on.
  const isRTL = (l === 'ar');
  ['tt-h','tt-s','tt-b','compass-title','credit','pub-link'].forEach(id=>{
    const el=document.getElementById(id);
    if(!el) return;
    el.dir = isRTL ? 'rtl' : 'ltr';
    el.style.textAlign = isRTL ? 'right' : '';
    el.style.letterSpacing = isRTL ? 'normal' : '';
  });
}

function setLang(l){applyLang(l);}

// Tooltip
const tt=document.getElementById('tt');
const tth=document.getElementById('tt-h');
const tts=document.getElementById('tt-s');
const ttb=document.getElementById('tt-b');
const stage=document.getElementById('stage');

function posTT(cx,cy){
  const W=285,H=tt.offsetHeight||220;
  const sw=stage.offsetWidth,sh=stage.offsetHeight;
  let x=cx+14,y=cy+14;
  if(x+W>sw) x=cx-W-14;
  if(y+H>sh) y=cy-H-14;
  if(x<6) x=6;
  if(y<6) y=6;
  tt.style.left=x+'px';
  tt.style.top=y+'px';
}

// Unified mouse handler - single source of truth
// All tooltip logic driven from one mousemove on the stage overlay
let puzzleAngle=0;
let lastCX=0, lastCY=0;
let hoverState=-1; // -1=none, 0/1/2=sector, 3/4/5=puzzle piece

const CX=540, CY=540;
const PUZZLE_OUTER=200, PUZZLE_INNER=122;
const SECTOR_OUTER=432, SECTOR_INNER=210;

function getZone(svgX, svgY){
  const dx=svgX-CX, dy=svgY-CY;
  const dist=Math.sqrt(dx*dx+dy*dy);
  // Angle 0=top, clockwise
  const angle=(Math.atan2(dx,-dy)*180/Math.PI+360)%360;

  // Puzzle ring
  if(dist>=PUZZLE_INNER && dist<=PUZZLE_OUTER){
    // At rotation=0: People=300°-60°, Process=60°-180°, Technology=180°-300°
    // Subtract puzzleAngle to get piece-local angle, then offset by 300° so People starts at 0
    const local=((angle-puzzleAngle)%360+360)%360;
    const adjusted=(local-300+360)%360;
    return 3+Math.floor(adjusted/120); // 3=People,4=Process,5=Technology
  }

  // Outer sector ring
  if(dist>=SECTOR_INNER && dist<=SECTOR_OUTER){
    // Boundaries at 15°, 135°, 255° (from SVG path endpoints)
    // Sector 0 (CRM):         15°-135°  (top-right)
    // Sector 1 (D&R):        135°-255°  (bottom)
    // Sector 2 (Resilience): 255°-360° and 0°-15° (top-left, wraps)
    if(angle>=15  && angle<135) return 0;
    if(angle>=135 && angle<255) return 1;
    return 2;
  }
  return -1;
}

function showTT(zone, cx, cy){
  const d = zone<3 ? TT[lang][zone] : TTP[lang][zone-3];
  tth.textContent=d.h; tts.textContent=d.s; ttb.textContent=d.b;
  tt.classList.add('on');
  posTT(cx, cy);
}

// Single mousemove listener on the hits SVG (sits above everything)
const hitsSvg=document.getElementById('hits');
hitsSvg.style.pointerEvents='all';
// Remove individual hit path pointer events - we handle everything here
[0,1,2].forEach(i=>{
  const el=document.getElementById('hit'+i);
  if(el) el.style.pointerEvents='none';
});

hitsSvg.addEventListener('mousemove', function(e){
  const r=stage.getBoundingClientRect();
  const cx=e.clientX-r.left, cy=e.clientY-r.top;
  lastCX=cx; lastCY=cy;
  const scale=1080/r.width;
  const zone=getZone(cx*scale, cy*scale);
  // If in puzzle ring, mark as -2 so tick loop keeps refreshing even when not moving
  hoverState=(zone>=3)?-2:zone;
  if(zone===-1){ tt.classList.remove('on'); hitsSvg.style.cursor='default'; }
  else { showTT(zone, cx, cy); hoverState=zone; hitsSvg.style.cursor='pointer'; }
});

hitsSvg.addEventListener('mouseleave', function(){
  tt.classList.remove('on');
  hoverState=-1;
  hitsSvg.style.cursor='default';
});

// Animation
const A={T:31.8,t:0,spin:0,needle:0,lastActive:75,centers:[75,195,315],cd:6.0,pc:[1.0,3.0,5.0],W:1.3,last:0};
function easeOut(x){return 1-Math.pow(1-x,3);}
function pulse(cp,c){let d=Math.abs(cp-c);d=Math.min(d,A.cd-d);return d>A.W?0:0.5*(1+Math.cos(Math.PI*d/A.W));}
function lerp(a,b,p){return a+(b-a)*p;}

function tick(now){
  const dt=Math.min(0.05,(now-A.last)/1000);
  A.last=now; A.t+=dt; if(A.t>=A.T)A.t-=A.T; A.spin+=dt;

  const root=document.getElementById('compassRoot');
  const needleEl=document.getElementById('needle');
  const grps=[document.getElementById('grp0'),document.getElementById('grp1'),document.getElementById('grp2')];
  const glows=[document.getElementById('glow0'),document.getElementById('glow1'),document.getElementById('glow2')];
  const puzzle=document.getElementById('puzzle');

  const id=1.8,p=Math.max(0,Math.min(1,A.t/id)),e=easeOut(p);
  if(root){
    root.setAttribute('transform','translate(540,540) rotate('+lerp(-150,0,e).toFixed(2)+') scale('+lerp(0.80,1,e).toFixed(3)+') translate(-540,-540)');
    root.setAttribute('opacity',Math.max(0,Math.min(1,p*1.7)).toFixed(3));
  }

  const tc=A.t-id,cp=tc<0?-99:((tc%A.cd+A.cd)%A.cd);
  const ps=[0,1,2].map(i=>tc<0?0:pulse(cp,A.pc[i]));
  const sum=ps.reduce((a,b)=>a+b,0);

  grps.forEach((g,i)=>{if(g)g.setAttribute('opacity',lerp(0.40,1.0,Math.min(1,0.50+(0.50)*ps[i])).toFixed(3));});
  glows.forEach((g,i)=>{if(g){const gw=Math.max(0,Math.min(1,(Math.min(1,0.50+(0.50)*ps[i])-0.55)/0.45));g.setAttribute('opacity',(gw*0.20).toFixed(3));}});

  let target=A.lastActive;
  if(sum>0.04){
    let sx=0,sy=0;
    ps.forEach((v,i)=>{const a=A.centers[i]*Math.PI/180;sx+=v*Math.sin(a);sy+=v*Math.cos(a);});
    target=Math.atan2(sx,sy)*180/Math.PI;
    let mi=0;ps.forEach((v,i)=>{if(v>ps[mi])mi=i;});A.lastActive=A.centers[mi];
  }
  let diff=((target-A.needle+540)%360)-180;
  A.needle+=diff*0.10;
  const sway=(sum<0.15?4:1.2)*Math.sin(A.t*2.0);
  if(needleEl)needleEl.setAttribute('transform','rotate('+((A.needle+sway).toFixed(2))+' 540 540)');
  const pAngle=(A.spin*13)%360;
  puzzleAngle=pAngle;
  if(puzzle)puzzle.setAttribute('transform','rotate('+pAngle.toFixed(2)+' 540 540)');
  // Refresh tooltip live every frame when cursor is over puzzle ring
  if(hoverState>=3 || hoverState===-2){
    const scale=1080/stage.offsetWidth;
    const zone=getZone(lastCX*scale, lastCY*scale);
    if(zone!==hoverState){
      hoverState=zone;
      if(zone===-1){ tt.classList.remove('on'); hitsSvg.style.cursor='default'; }
      else { showTT(zone, lastCX, lastCY); hitsSvg.style.cursor='pointer'; }
    }
  }

  requestAnimationFrame(tick);
}

// Init
applyLang(lang);
A.last=performance.now();
requestAnimationFrame(tick);
</script>
</body>
