<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Cybersecurity Compass</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:#000;height:100%;}
@keyframes waveDrift{from{background-position:0 0,0 0;}to{background-position:1200px 0,-900px 0;}}
@keyframes hazeFloat{0%{transform:translate3d(-2%,0,0) scale(1.05);}50%{transform:translate3d(2%,-1%,0) scale(1.09);}100%{transform:translate3d(-2%,0,0) scale(1.05);}}
#wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;}
#stage{position:relative;width:min(96vw,96vh);aspect-ratio:1/1;overflow:hidden;background:#0a0c0e;border-radius:6px;box-shadow:0 30px 80px rgba(0,0,0,.6);}
.bg1{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 16%,#22262c 0%,#14171b 38%,#0a0c0e 70%,#050607 100%);}
.bg2{position:absolute;inset:0;opacity:.55;background:linear-gradient(180deg,rgba(40,46,54,0) 42%,rgba(58,68,80,.22) 72%,rgba(7,9,11,.92) 100%);}
.bg3{position:absolute;left:-10%;top:-12%;width:120%;height:66%;opacity:.4;background:radial-gradient(60% 80% at 30% 40%,rgba(124,134,144,.18),transparent 60%),radial-gradient(50% 70% at 76% 28%,rgba(92,102,112,.16),transparent 60%);animation:hazeFloat 26s ease-in-out infinite;}
.bg4{position:absolute;left:0;right:0;bottom:0;height:48%;opacity:.16;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 2px,transparent 2px 9px),repeating-linear-gradient(90deg,rgba(255,255,255,.045) 0 1px,transparent 1px 14px);background-size:1200px 100%,900px 100%;animation:waveDrift 18s linear infinite;mix-blend-mode:screen;}
.bg5{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(4,5,7,.62) 32%,rgba(4,5,7,.2) 56%,rgba(4,5,7,0) 70%);}
#compass-svg{position:absolute;inset:0;width:100%;height:100%;display:block;}
/* UI overlays */
#lang-bar{position:absolute;top:10px;right:10px;z-index:100;display:flex;gap:4px;align-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:4px 6px;}
#lang-bar button{padding:3px 9px;border-radius:5px;border:none;cursor:pointer;font-weight:600;font-size:10px;font-family:Inter,system-ui,sans-serif;transition:all .2s;letter-spacing:.04em;}
#compass-title{position:absolute;top:12px;left:14px;z-index:100;font-family:Inter,Arial,sans-serif;font-size:clamp(16px,3.2vmin,35px);font-weight:600;color:#fff;letter-spacing:.2px;pointer-events:none;}
#credit{position:absolute;bottom:10px;left:12px;z-index:100;font-family:Inter,Arial,sans-serif;font-size:9px;color:rgba(255,255,255,.35);letter-spacing:.04em;line-height:1.6;pointer-events:auto;}
#pub-link{position:absolute;bottom:10px;right:12px;z-index:100;font-family:Inter,Arial,sans-serif;font-size:8px;color:rgba(255,255,255,.35);letter-spacing:.03em;line-height:1.6;text-align:right;max-width:52%;pointer-events:auto;}
/* Tooltip */
#tt{position:absolute;pointer-events:none;z-index:300;opacity:0;transition:opacity .2s ease;width:285px;background:rgba(8,10,12,.94);border:1px solid rgba(255,255,255,.13);border-radius:10px;padding:14px 16px;backdrop-filter:blur(12px);}
#tt.on{opacity:1;}
#tt-h{font-family:Inter,Arial,sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#E01C24;margin-bottom:4px;}
#tt-s{font-family:Inter,Arial,sans-serif;font-size:9px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:rgba(255,255,255,.38);margin-bottom:10px;}
#tt-b{font-family:Inter,Arial,sans-serif;font-size:11px;line-height:1.7;color:rgba(255,255,255,.78);}
/* Hit areas */
#hits{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:50;}
#hits path{pointer-events:all;cursor:pointer;fill:transparent;}
</style>
</head>

    {h:"Cyber Risk Management",s:"Before a Breach · Proactive & Predictive",
     b:"The true north of your cybersecurity compass. Without it, organizations drift from crisis to crisis, reacting, recovering, never truly reducing risk. Cyber Risk Management is the proactive and predictive discipline that anticipates threats before they materialize, prioritizes what matters most, optimizes security investments, and gives executives a clear language to make strategic decisions. Cybercriminals are not only searching for technical vulnerabilities. They are looking for the uncertainty and indecision that comes from having no north. This is what closes that gap."},
    {h:"Detection and Response",s:"During a Breach · Reactive & Defensive",

    {h:"Cyber Resilience",s:"After a Breach · Recover & Improve · An Outcome",

const IDS={crm:'t-crm',pap:'t-pap',bab:'t-bab',dar:'t-dar',rad:'t-rad',dub:'t-dub',cr:'t-cr',rai:'t-rai',aab:'t-aab',ppl:'t-ppl',prc:'t-prc',tch:'t-tch'};

let lang=(()=>{const n=(navigator.language||'en').slice(0,2).toLowerCase();return T[n]?n:'en';})();

function applyLang(l){
  lang=l;
  const t=T[l];
  Object.entries(IDS).forEach(([k,id])=>{
    const el=document.getElementById(id);
    if(el) el.textContent=t[k];
    else console.warn('Missing element:',id);
  });
  document.getElementById('compass-title').textContent=t.title;
  document.getElementById('credit').innerHTML=t.credit+'<br><a href="https://www.linkedin.com/in/jpcastro/" target="_blank" style="color:rgba(255,255,255,.5);text-decoration:none;">Juan Pablo Castro Vilaró</a>';
  document.getElementById('pub-link').innerHTML='<a href="'+t.pubUrl+'" target="_blank" style="color:rgba(255,255,255,.45);text-decoration:none;display:block;margin-bottom:2px;">'+t.pubTitle+'</a><a href="'+t.pubDoiUrl+'" target="_blank" style="color:rgba(255,255,255,.28);text-decoration:none;">DOI: '+t.pubDoi+'</a>';
  ['en','es','pt'].forEach(c=>{
    const b=document.getElementById('btn-'+c);
    b.style.background=c===l?'#E01C24':'rgba(255,255,255,0.1)';
    b.style.color=c===l?'#fff':'#888';
  });
}

function setLang(l){applyLang(l);}

// Tooltip
const tt=document.getElementById('tt');
const tth=document.getElementById('tt-h');
const tts=document.getElementById('tt-s');
const ttb=document.getElementById('tt-b');
const stage=document.getElementById('stage');

function posTT(cx,cy){
  const W=285,H=tt.offsetHeight||220;
  const sw=stage.offsetWidth,sh=stage.offsetHeight;
  let x=cx+14,y=cy+14;
  if(x+W>sw) x=cx-W-14;
  if(y+H>sh) y=cy-H-14;
  if(x<6) x=6;
  if(y<6) y=6;
  tt.style.left=x+'px';
  tt.style.top=y+'px';
}

[0,1,2].forEach(i=>{
  const el=document.getElementById('hit'+i);
  el.addEventListener('mouseenter',function(e){
    const r=stage.getBoundingClientRect();
    const d=TT[lang][i];
    tth.textContent=d.h; tts.textContent=d.s; ttb.textContent=d.b;
    tt.classList.add('on');
    posTT(e.clientX-r.left, e.clientY-r.top);
  });
  el.addEventListener('mousemove',function(e){
    const r=stage.getBoundingClientRect();
    posTT(e.clientX-r.left, e.clientY-r.top);
  });
  el.addEventListener('mouseleave',function(){tt.classList.remove('on');});
});

// Animation
const A={T:31.8,t:0,spin:0,needle:0,lastActive:75,centers:[75,195,315],cd:6.0,pc:[1.0,3.0,5.0],W:1.3,last:0};
function easeOut(x){return 1-Math.pow(1-x,3);}
function pulse(cp,c){let d=Math.abs(cp-c);d=Math.min(d,A.cd-d);return d>A.W?0:0.5*(1+Math.cos(Math.PI*d/A.W));}
function lerp(a,b,p){return a+(b-a)*p;}

function tick(now){
  const dt=Math.min(0.05,(now-A.last)/1000);
  A.last=now; A.t+=dt; if(A.t>=A.T)A.t-=A.T; A.spin+=dt;

  const root=document.getElementById('compassRoot');
  const needleEl=document.getElementById('needle');
  const grps=[document.getElementById('grp0'),document.getElementById('grp1'),document.getElementById('grp2')];
  const glows=[document.getElementById('glow0'),document.getElementById('glow1'),document.getElementById('glow2')];
  const puzzle=document.getElementById('puzzle');

  const id=1.8,p=Math.max(0,Math.min(1,A.t/id)),e=easeOut(p);
  if(root){
    root.setAttribute('transform','translate(540,540) rotate('+lerp(-150,0,e).toFixed(2)+') scale('+lerp(0.80,1,e).toFixed(3)+') translate(-540,-540)');
    root.setAttribute('opacity',Math.max(0,Math.min(1,p*1.7)).toFixed(3));
  }

  const tc=A.t-id,cp=tc<0?-99:((tc%A.cd+A.cd)%A.cd);
  const ps=[0,1,2].map(i=>tc<0?0:pulse(cp,A.pc[i]));
  const sum=ps.reduce((a,b)=>a+b,0);

  grps.forEach((g,i)=>{if(g)g.setAttribute('opacity',lerp(0.40,1.0,Math.min(1,0.50+(0.50)*ps[i])).toFixed(3));});
  glows.forEach((g,i)=>{if(g){const gw=Math.max(0,Math.min(1,(Math.min(1,0.50+(0.50)*ps[i])-0.55)/0.45));g.setAttribute('opacity',(gw*0.20).toFixed(3));}});

  let target=A.lastActive;
  if(sum>0.04){
    let sx=0,sy=0;
    ps.forEach((v,i)=>{const a=A.centers[i]*Math.PI/180;sx+=v*Math.sin(a);sy+=v*Math.cos(a);});
    target=Math.atan2(sx,sy)*180/Math.PI;
    let mi=0;ps.forEach((v,i)=>{if(v>ps[mi])mi=i;});A.lastActive=A.centers[mi];
  }
  let diff=((target-A.needle+540)%360)-180;
  A.needle+=diff*0.10;
  const sway=(sum<0.15?4:1.2)*Math.sin(A.t*2.0);
  if(needleEl)needleEl.setAttribute('transform','rotate('+((A.needle+sway).toFixed(2))+' 540 540)');
  if(puzzle)puzzle.setAttribute('transform','rotate('+((A.spin*13)%360).toFixed(2)+' 540 540)');

  requestAnimationFrame(tick);
}

// Init
applyLang(lang);
A.last=performance.now();
requestAnimationFrame(tick);
</script>
