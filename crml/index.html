        // -- Tooltip HTML strings --
        'tip.crml': `<strong>Gestão do Ciclo de Vida do Ciber Risco (CRML)</strong><span class="meta">ANTES DE UMA BRECHA · MARCO ESTRATÉGICO · CICLO CONTÍNUO</span><span class="body">Um ciclo contínuo, antes de uma brecha, que se executa para cada ativo digital, o motor operacional do <a href="https://www.researchgate.net/publication/389628862" target="_blank" rel="noopener">Cybersecurity Compass</a> e complementar a marcos orientados a resultados como NIST CSF 2.0. Onde o marco nomeia os destinos, o CRML fornece a rota e a cadência: identificar, avaliar, mitigar e verificar a redução. Na era da IA, onde <a href="https://www.researchgate.net/publication/398971490" target="_blank" rel="noopener">os atacantes se movem em velocidade de máquina</a>, o ciclo deve executar-se também em velocidade de máquina, mantendo-se sob governança humana.</span><span class="quote">"<a href="https://www.researchgate.net/publication/388653064" target="_blank" rel="noopener">O que não se define não se pode medir. O que não se mede, não se pode melhorar. O que não se melhora, sempre se degrada.</a>"</span>`,
        'tip.people': `<strong>Pessoas</strong><span class="meta">PILAR FUNDAMENTAL · CULTURA · CYBER RISK HUNTERS</span><span class="body">Um dos três pilares fundamentais da cibersegurança. Abrange o elemento humano, a conscientização em segurança, o treinamento e a cultura organizacional, junto com <a href="https://www.researchgate.net/publication/395721548" target="_blank" rel="noopener">Cyber Risk Hunters</a> dedicados que perguntam onde a organização poderia ser comprometida, complementando os threat hunters que perguntam se já está.</span>`,
        'tip.process': `<strong>Processo</strong><span class="meta">PILAR FUNDAMENTAL · CYBERRISKOPS · CROC + CROM</span><span class="body">Um dos três pilares fundamentais. As políticas, procedimentos e metodologias, incluindo o próprio CRML, que estruturam como a cibersegurança é praticada. Os programas modernos operacionalizam isso por meio do <a href="https://www.researchgate.net/publication/402149983" target="_blank" rel="noopener">CyberRiskOps</a>: processos contínuos e adaptativos que fundem a avaliação do ciber risco e a <a href="https://www.researchgate.net/publication/388564202" target="_blank" rel="noopener">redução do ciber risco</a> em um único ciclo, eliminando a lacuna tradicional entre identificar ciber riscos e reduzi-los efetivamente. CyberRiskOps é executado por um <a href="https://www.researchgate.net/publication/388194441" target="_blank" rel="noopener">Cyber Risk Operations Center (CROC)</a> dedicado que trabalha antes de uma brecha, caçando continuamente a exposição e impulsionando a redução, enquanto o SOC trata do que já está acontecendo. O <a href="https://www.researchgate.net/publication/390490235" target="_blank" rel="noopener">Cyber Risk Operational Model (CROM)</a> fornece o caminho de maturidade que move o programa de um mapeamento estático do risco para operações proativas.</span>`,
        'tip.technology': `<strong>Tecnologia</strong><span class="meta">PILAR FUNDAMENTAL · CREM + CRQ + AEV</span><span class="body">Um dos três pilares fundamentais. As plataformas que operacionalizam a gestão do ciber risco em escala. Cyber Risk Exposure Management (CREM) unifica o inventário de ativos, a contextualização de ativos potencializada por IA, o <a href="https://www.researchgate.net/publication/388321083" target="_blank" rel="noopener">Cyber Risk Asset Graph</a> que mapeia as relações através da superfície de ataque, a <a href="https://www.researchgate.net/publication/388421250" target="_blank" rel="noopener">Gestão de Vulnerabilidades Baseada em Ciber Risco (RBVM)</a>, e a avaliação de exposição. A <a href="https://www.researchgate.net/publication/396206049" target="_blank" rel="noopener">Quantificação do Ciber Risco (CRQ)</a> expressa o ciber risco em termos financeiros sobre os quais os executivos podem agir, convertendo a probabilidade e o impacto em uma perda provável e um intervalo, não em uma cor. Adversarial Exposure Validation (AEV) testa as defesas contra técnicas de ataque reais para verificar se os controles realmente funcionam. Juntas, essas capacidades tornam o ciber risco mensurável, priorizável e redutível de forma contínua.</span>`,
        'tip.inventory': `<strong>Inventariar, Contextualizar e Avaliar Ativos Digitais</strong><span class="meta">ETAPA 1 · ATIVOS + CONTEXTO · CRITICIDADE</span><span class="body">O ciclo começa aqui. Identifique todos os ativos digitais, dispositivos, aplicações, dados, e especialmente identidades (frequentemente atacadas pelos cibercriminosos), e contextualize cada um dentro de seu <a href="https://www.researchgate.net/publication/388321083" target="_blank" rel="noopener">papel de negócio e dependências</a>. O contexto é o que torna a valoração significativa: o mesmo servidor pode ser periférico em uma organização e crítico para a missão em outra. O resultado é a criticidade do ativo que impulsiona cada decisão posterior de priorização; sem ela, a priorização se torna conjecturas.</span>`,
        'tip.identify': `<strong>Identificar Vulnerabilidades, Ameaças e Consequências</strong><span class="meta">ETAPA 2 · ANÁLISE DA TRÍADE · DIAGNÓSTICO</span><span class="body">Para cada ativo, analise <a href="https://www.researchgate.net/publication/388386953" target="_blank" rel="noopener">três elementos que se intersectam</a> para calcular sua pontuação de ciber risco. Vulnerabilidades: fraquezas como software sem patch, configurações incorretas, ou exposição à engenharia social. Ameaças: atores ou eventos que poderiam explorá-las, desde atacantes externos até ameaças internas. Consequências: impactos operacionais, reputacionais, legais e financeiros, ponderados pela criticidade do ativo estabelecida na etapa anterior. Onde os três convergem, isso é o ciber risco, calculado por ativo.</span>`,
        'tip.assessment': `<strong>Avaliação, Cálculo e Priorização do Ciber Risco</strong><span class="meta">ETAPA 3 · CRI · NIST + MITRE ATT&amp;CK</span><span class="body">O ciber risco é quantificado como um <a href="https://www.researchgate.net/publication/389001302" target="_blank" rel="noopener">Índice de Ciber Risco (CRI)</a>, um valor numérico calculado usando padrões da indústria como NIST e MITRE ATT&amp;CK, informado pelo julgamento de especialistas onde os dados se esgotam. O propósito do número não é o número em si; é o ranking. Um perfil claro de ciber risco envia os recursos escassos primeiro às exposições mais significativas, em vez de distribuí-los uniformemente entre ciber riscos que nunca foram iguais.</span>`,
        'tip.mitigation': `<strong>Mitigação do Ciber Risco</strong><span class="meta">ETAPA 4 · CONTROLES · AÇÃO</span><span class="body">Implanta ações e controles, técnicos (firewalls, criptografia, segmentação) e administrativos (políticas de acesso, treinamento, resposta a incidentes), para reduzir a probabilidade ou o impacto das ameaças. Criticamente, a mitigação não é o mesmo que a <a href="https://www.researchgate.net/publication/388564202" target="_blank" rel="noopener">redução do ciber risco</a>; a redução é a diminuição mensurável da exposição uma vez que essas mitigações realmente surtem efeito.</span>`,
        'tip.recalc': `<strong>Avaliação e Recálculo do Ciber Risco</strong><span class="meta">ETAPA 5 · VERIFICAÇÃO · NÍVEIS ORG + ATIVO</span><span class="body">A etapa que a maioria dos programas pula. Após aplicar os controles, o <a href="https://www.researchgate.net/publication/389001302" target="_blank" rel="noopener">Índice de Ciber Risco (CRI)</a> é recalculado no nível da organização e no nível do ativo para verificar se cada controle realmente reduziu o ciber risco, ou apenas pareceu reduzir. O fechamento do ticket foi atividade; a queda do número é a redução. Isso também é o que mantém a organização alinhada com a velocidade do negócio e a <a href="https://www.researchgate.net/publication/398971490" target="_blank" rel="noopener">velocidade do atacante</a>, não com a velocidade da última auditoria.</span>`,
        'tip.asset': `<strong>Para Cada Ativo Digital</strong><span class="meta">POR ATIVO · DINÂMICO · COMPARTILHADO · CONTÍNUO</span><span class="body">O CRML é aplicado a cada ativo digital individualmente. Cada dispositivo, identidade, aplicação e conexão implica um ciber risco que deve ser calculado, e na era da IA, <a href="https://www.researchgate.net/publication/406634241" target="_blank" rel="noopener">os agentes agora criam suas próprias conexões</a> através de APIs e Model Context Protocol que são, cada uma, uma nova exposição por si mesmas. O ciber risco é dinâmico, compartilhado e contínuo: evolui em tempo real, requer colaboração entre todos os atores, e exige uma reavaliação contínua em vez de instantâneos pontuais.</span>`,
        'tip.consolidate': `<strong>Consolidar Ciber Risco</strong><span class="meta">AGREGADO · VISÃO ORGANIZACIONAL · ESTRATÉGICO</span><span class="body">Todas as pontuações de ciber risco por ativo da etapa anterior são normalizadas e agregadas. A consolidação pode ser executada no nível da organização para uma visão unificada, ou em sub-níveis por grupos de ativos etiquetados (unidades de negócio, geografias, portfólios de aplicações, ou qualquer dimensão operacional) para visibilidade direcionada. Isso move a conversa de achados técnicos isolados para uma imagem holística, alinhada ao negócio, sobre a qual os executivos e membros do conselho podem agir.</span>`,
        'tip.apply': `<strong>Aplicar Defesas e Controles</strong><span class="meta">IMPLANTAR · TÉCNICO + ADMINISTRATIVO · PRIORIZADO</span><span class="body">Com base no perfil de ciber risco priorizado da etapa anterior, implante as defesas apropriadas, soluções técnicas como firewalls e criptografia, mais controles administrativos como políticas de acesso e treinamento. Os controles são escolhidos para enfrentar os ciber riscos de maior prioridade, não como uma lista de verificação universal.</span>`,
        'tip.monitoring': `<strong>Monitoramento do Ciber Risco</strong><span class="meta">CONTÍNUO · SOC + CROC · TEMPO REAL</span><span class="body">Supervisão contínua que circunda as cinco etapas e nunca para. O monitoramento do ciber risco não é um projeto, é uma postura: novos ativos aparecem, novas vulnerabilidades surgem, o panorama de ameaças muda, e um recálculo que estava correto na semana passada está incorreto hoje. O monitoramento é o que diz ao ciclo quando girar novamente. Executado por um <a href="https://www.researchgate.net/publication/388194441" target="_blank" rel="noopener">Cyber Risk Operations Center (CROC)</a> dedicado, junto com o SOC.</span>`,
      }
    };

    let _currentLang = 'en';

    function setLanguage(lang) {
      if (!I18N[lang]) lang = 'en';
      _currentLang = lang;
      const dict = I18N[lang];
      // Update plain-text data-i18n elements (textContent)
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (dict[key] !== undefined) el.textContent = dict[key];
      });
      // Update HTML data-i18n-html elements (innerHTML)
      document.querySelectorAll('[data-i18n-html]').forEach(el => {
        const key = el.getAttribute('data-i18n-html');
        if (dict[key] !== undefined) el.innerHTML = dict[key];
      });
      // Update tooltip content for elements with data-tip-key
      document.querySelectorAll('[data-tip-key]').forEach(el => {
        const key = el.getAttribute('data-tip-key');
        if (dict[key] !== undefined) el.setAttribute('data-tip', dict[key]);
      });
      // Update active state on selector buttons
      document.querySelectorAll('.lang-selector button[data-lang]').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
      });
      // Update document language attribute
      document.documentElement.lang = lang;
    }

    // Wire up language selector buttons
    document.querySelectorAll('.lang-selector button[data-lang]').forEach(btn => {
      btn.addEventListener('click', () => setLanguage(btn.getAttribute('data-lang')));
    });

    // Auto-detect browser language on load
    // Walk navigator.languages (the user's full preference list, e.g. ["pt-BR", "pt", "en-US", "en"])
    // and pick the first one that matches our supported set (es | pt). If none matches, stay on en (default).
    (function autoDetectLanguage() {
      const supported = new Set(['en', 'es', 'pt']);
      const prefs = (navigator.languages && navigator.languages.length)
        ? navigator.languages
        : [navigator.language || navigator.userLanguage || 'en'];
      for (const raw of prefs) {
        if (!raw) continue;
        const code = raw.toLowerCase().slice(0, 2); // 'es-MX' → 'es', 'pt-BR' → 'pt', 'en-US' → 'en'
        if (supported.has(code)) {
          setLanguage(code);
          return;
        }
      }
      // No match — leave default 'en'
      setLanguage('en');
    })();


    // -- CTA tooltip wiring on the Identify satellite click surface --
    // Mini Venn becomes visible at t=12s via the existing opacity animation.
    // We check the parent group's computed opacity to gate clicks/hover — this also
    // handles Replay correctly (animation resets → opacity resets → guard re-activates).
    function isVennVisible() {
      const venn = document.getElementById('venn-pulse-group');
      if (!venn || !venn.parentElement) return false;
      return parseFloat(getComputedStyle(venn.parentElement).opacity) > 0.5;
    }
    function handleVennClick() {
      if (!isVennVisible()) return;
      openCyberRiskModal();
    }
    (function() {
      const trigger = document.getElementById('venn-cta-trigger');
      const cta = document.getElementById('cta-tip');
      if (!trigger || !cta) return;
      function positionAt(x, y) {
        // Place anchor exactly at cursor; CSS transform centers the pill horizontally and lifts it above the cursor
        cta.style.left = x + 'px';
        cta.style.top  = y + 'px';
        cta.classList.remove('flipped');
        requestAnimationFrame(() => {
          const r = cta.getBoundingClientRect();
          // Flip below the cursor if no room above
          if (r.top < 8) {
            cta.classList.add('flipped');
          }
          // Clamp horizontally if the pill would overflow either edge
          const halfW = r.width / 2;
          if (x - halfW < 12) {
            cta.style.left = (12 + halfW) + 'px';
          } else if (x + halfW > window.innerWidth - 12) {
            cta.style.left = (window.innerWidth - 12 - halfW) + 'px';
          }
        });
      }
      trigger.addEventListener('mouseenter', e => {
        if (!isVennVisible()) return;
        positionAt(e.clientX, e.clientY);
        cta.classList.add('visible');
        cta.setAttribute('aria-hidden', 'false');
      });
      trigger.addEventListener('mousemove', e => {
        if (!isVennVisible()) return;
        positionAt(e.clientX, e.clientY);
      });
      trigger.addEventListener('mouseleave', () => {
        cta.classList.remove('visible');
        cta.setAttribute('aria-hidden', 'true');
      });
    })();
