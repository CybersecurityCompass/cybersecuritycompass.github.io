<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CyberRiskOps &middot; build sequence</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Extra+Condensed:wght@300;400;500;600&family=Barlow+Condensed:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#000000; --steel:#6D6E71; --croc:#C40000; --crem:#6E0000;
    --red-bright:#D7191F; --red-deep:#6E0000;
    --accent:#C4322B;
    --ui:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    --paper:#FFFFFF;
    --label-weight:400;
    --face:"Saira Extra Condensed","Barlow Condensed","Fira Sans Extra Condensed","Arial Narrow",Arial,sans-serif;
    --ease:cubic-bezier(.4,0,.2,1); --morph:cubic-bezier(.32,1.14,.6,1);
    --dx:0px;   /* how far the big gears draw in to mesh */
    --grow:1.1s; --fade:.85s;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--ink)}
  body{display:flex;align-items:center;justify-content:center;font-family:var(--face);color:#D8D8D8}
  .stage{position:relative;width:100%;max-width:1600px}
  svg{display:block;width:100%;height:auto}
  /* ---- page title, credit and citation: taken from the CRML page's own CSS ---- */
  .page-title{position:fixed;top:30px;left:36px;z-index:10;user-select:none;max-width:480px;pointer-events:none}
  .page-title .eyebrow{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.24em;
                       color:#888;margin-bottom:18px;pointer-events:auto}
  .page-title .main{font-size:clamp(24px,2.8vw,36px);font-weight:400;color:#FFFFFF;line-height:1.12;
                    letter-spacing:-.005em;margin-bottom:16px;pointer-events:auto}
  .page-title .main em{font-style:normal;color:var(--accent);font-weight:500}
  .page-title .acronym{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;
                       letter-spacing:.34em;color:var(--accent);padding:5px 12px 4px 14px;
                       border:1px solid rgba(196,50,43,.4);border-radius:3px}
  .compass-link{cursor:pointer;transition:color .15s ease;color:inherit;
                border-bottom:1px dotted rgba(255,255,255,.25);text-decoration:none}
  .compass-link:hover{color:var(--accent);border-bottom-color:var(--accent)}

  .credit{position:fixed;bottom:18px;left:22px;font-size:12px;line-height:1.5;color:#666;user-select:none}
  .credit .label{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;
                 color:#555;margin-bottom:2px}
  .credit a{color:#888;text-decoration:none;font-size:11px;transition:color .15s}
  .credit a:hover{color:var(--accent)}

  .publication{position:fixed;bottom:22px;right:28px;z-index:10;user-select:none;text-align:right;line-height:1.4}
  .pub-title{font-size:11px;font-weight:500;color:#888;text-decoration:none;display:block;
             margin-bottom:5px;white-space:nowrap;transition:color .15s ease}
  .pub-title:hover{color:var(--accent)}
  .pub-doi{font-size:9.5px;font-weight:500;color:#666;letter-spacing:.02em}
  .pub-doi a{color:inherit;text-decoration:none;transition:color .15s ease}
  .pub-doi a:hover{color:var(--accent)}

  @media (max-width:820px){
    .page-title{top:18px;left:20px;max-width:calc(100vw - 40px)}
    .page-title .eyebrow{font-size:9px;letter-spacing:.2em;margin-bottom:10px}
    .credit{bottom:22px;left:20px}
    .pub-title{white-space:normal}
  }




  .t{fill:var(--paper);font-family:var(--face);font-weight:var(--label-weight);letter-spacing:.01em}
  .t-ring{font-size:21px}
  .t-flow{font-size:30px}
  .t-arc{font-size:30px}
  .t-gear{font-size:30px}
  .t-core{font-size:28px}

  /* ---- anything with data-from appears at its stage and stays ---- */
  [data-from]{opacity:0;transition:opacity var(--fade) ease}
  [data-from].on{opacity:1}
  /* identification and mitigation wait for the slide to finish before going: the
     delay lives in the off state, so it applies on the way out and not on the way in */
  .lateOut{transition:opacity .5s ease .9s}
  .lateOut.on{transition:opacity var(--fade) ease 0s}
  /* the band waits for the slide to land before it appears, so its end arcs take
     over from the two halves rather than materialising underneath them */
  .lateIn{transition:opacity .6s ease .85s}
  /* once the scoring ring is there, the gaps between the arrows read as that layer
     showing through, so they take its colour */
  #bandSeams{transition:stroke .8s ease}
  svg.st9 #bandSeams{stroke:var(--steel)}
  .ringIn{transform-origin:800px 450px;transform:scale(.965);
          transition:transform var(--grow) var(--morph),opacity var(--fade) ease}
  .ringIn.on{transform:scale(1)}
  /* the four phase labels wipe in along their own direction of flow: the top pair
     left to right, the bottom pair right to left, matching their arrows */
  .wipe{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);
        transition:transform .6s cubic-bezier(.3,0,.2,1)}
  .wipe.r{transform-origin:right center}
  svg.st8 .wipe{transform:scaleX(1)}
  /* the arc lettering sweeps along its own curve, identification then mitigation */
  #sIdf,#sMit{transition:transform .9s cubic-bezier(.3,0,.2,1)}
  #sIdf{transform-origin:510px 450px;transform:rotate(-222.7deg)}
  #sMit{transform-origin:1090px 450px;transform:rotate(-36.0deg);transition-delay:.45s}
  svg.st6 #sIdf{transform:rotate(-137.3deg)}
  svg.st6 #sMit{transform:rotate(36.0deg)}

  /* one after another, in the order the loop runs */
  #wCtx .wipe{transition-delay:0s}
  #wPri .wipe{transition-delay:.45s}
  #wVer .wipe{transition-delay:.9s}
  #wMon .wipe{transition-delay:1.35s}
  /* the three bodies zoom in on arrival. The zoom rides a wrapper, so body and
     teeth scale together and no tooth can peek out of the circle on the way in. */
  .zL,.zR,.zC{transform:scale(.25);transition:transform var(--grow) var(--morph),opacity var(--fade) ease}
  .zL.on{transform:translateX(var(--dx))}
  .zR.on{transform:translateX(calc(0px - var(--dx)))}
  .zC.on{transform:none}
  .zL{transform-origin:580px 450px}
  .zR{transform-origin:1020px 450px}
  .zC{transform-origin:800px 450px}

  /* ---- Three size states. The teeth sit at the silhouette radius from the
         start, hidden flush inside the body, so the morph at step 4 is the body
         shrinking to its root circle and the valleys opening up: the outline
         never moves and the three stay meshed exactly where they were. ---- */
  .body,.teeth,#lblL,#lblR,#lblC{transition:transform var(--grow) var(--morph)}
  #bL,#tL,#lblL{transform-origin:580px 450px}
  #bR,#tR,#lblR{transform-origin:1020px 450px}
  #bC,#tC,#lblC{transform-origin:800px 450px}
  #bL,#bR{transform:scale(var(--kb,1))}
  #tL,#tR{transform:scale(var(--kt,1))}
  #bC{transform:scale(var(--kbc,1))}
  #tC{transform:scale(var(--ktc,1))}
  #lblL,#lblR{transform:scale(var(--kl,1))}
  #lblC{transform:scale(var(--klc,1))}
  /* steps 1-3: the body IS the silhouette, i.e. the tip circle (r 143.6 and 84) */
  svg.st13{--kb:1.632;--kt:1.355;--kbc:1.647;--ktc:1.355;--kl:1.6;--klc:1.6}
  /* Step 4 is a single move: everything releases to 1, the finished size, and the two
     big gears draw 58 units inward at the same time. That lands their centres 162
     apart from the hinge, which puts each tooth tip 56 from the hinge's centre - inside
     a valley that spans 51 to 62. So they shrink and stay meshed rather than parting.
     They hold that position through steps 5 and 6, and open out at step 7. */
  svg.st46{--dx:58px}

  /* ---- before CONTINUOUS lands, the two remaining lines centre themselves ---- */
  .lbl2{transition:transform var(--grow) var(--ease)}
  svg.two .lbl2{transform:translateY(-16.2px)}

  /* ---- stage 5 and 6: each loop sits concentric with its gear, then slides
         out to become the end arc of the stadium ---- */
  /* Steps 5-6: each loop is the finished end arc, held 128 units inward so it sits
     concentric with its gear in the meshed position, which also makes the two loops
     overlap by 28 across the hinge. At step 7 it releases into the stadium's arc. */
  .tuckL,.tuckR{transition:transform var(--grow) var(--ease)}
  .tuckL{transform-origin:510px 450px}
  .tuckR{transform-origin:1090px 450px}
  svg.tucked .tuckL{transform:translateX(128px)}
  svg.tucked .tuckR{transform:translateX(-128px)}


  /* ---- the lifecycle turns once the gears are cut ---- */
  @keyframes cw {to{transform:rotate(360deg)}}
  @keyframes ccw{to{transform:rotate(-360deg)}}
  .spin{transform-origin:580px 450px}
  .spin.r{transform-origin:1020px 450px}
  .spin.c{transform-origin:800px 450px}
  svg.running .spin{animation:cw 30s linear infinite}
  svg.running .spin.c{animation-name:ccw}   /* the middle gear reverses, as a train does */
  @media (prefers-reduced-motion:reduce){svg.running .spin{animation:none}}

  /* ---- inspect mode: dormant until the sequence finishes ---- */
  #scrim{opacity:0;transition:opacity .18s ease;pointer-events:none}
  .stage.dim #scrim{opacity:.62}
  #holes use{display:none}
  #holes use.on{display:inline}
  .hit{fill:transparent;stroke:transparent;pointer-events:none}
  svg.done .hit{pointer-events:all;cursor:pointer}

  /* ---- chrome ---- */
  .bar{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
       display:flex;align-items:center;gap:8px;opacity:.28;transition:opacity .2s}
  .stage:hover .bar,.bar:focus-within{opacity:1}
  .bar button{background:transparent;border:1px solid #3A3A3A;color:#C9C9C9;
    font:500 11px/1 var(--face);letter-spacing:.1em;text-transform:uppercase;
    padding:7px 10px;border-radius:2px;cursor:pointer}
  .bar button:hover{border-color:#C40000;color:#fff;background:#170000}
  .bar button:focus-visible{outline:2px solid var(--red-bright);outline-offset:2px}
  #tip{
    position:absolute;pointer-events:none;opacity:0;transform:translateY(4px);
    transition:opacity .15s ease,transform .15s ease;
    max-width:390px;padding:11px 14px;border:1px solid #3B0000;border-left:3px solid var(--croc);
    background:rgba(8,8,8,.95);backdrop-filter:blur(2px);
  }
  #tip.show{opacity:1;transform:translateY(0)}
  #tip b{display:block;font-family:var(--face);font-size:13px;font-weight:500;letter-spacing:.11em;
         text-transform:uppercase;color:#fff;margin-bottom:5px}
  #tip span{display:block;font:400 13px/1.45 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:#ABABAB}
  .read{min-width:345px;text-align:center;font:500 11px/1 var(--face);
        letter-spacing:.12em;text-transform:uppercase;color:#8A8A8A}
  .read b{color:#fff;font-weight:500}
</style>
</head>

<div class="page-title">
  <div class="eyebrow"><a class="compass-link" href="https://cybersecuritycompass.github.io/" target="_blank" rel="noopener">Cybersecurity Compass</a> &middot; Before a Breach</div>
  <div class="main">The <em>Operationalization</em> of Cyber Risk</div>
  <div class="acronym">CyberRiskOps</div>
</div>

    <!-- Section outlines, defined once and used twice: as hit targets, and as the
         hole punched in the dimming scrim so the hovered section shows through at
         full strength. Each boundary is inset ~4 units from the seam centre-line so
         the steel chevron stays outside every hole, and each ring stops 1.5 short of
         its neighbour so no sliver of the next layer is caught. -->

    <!-- the scrim carries this mask: white shows the scrim, the hole hides it -->
    <mask id="spotMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1600" height="900">
      <rect width="1600" height="900" fill="#fff"/>
      <g id="holes" fill="#000">
        <use id="hole-idf"    href="#sec-idf"    xlink:href="#sec-idf"/>
        <use id="hole-ctx"    href="#sec-ctx"    xlink:href="#sec-ctx"/>
        <use id="hole-pri"    href="#sec-pri"    xlink:href="#sec-pri"/>
        <use id="hole-mit"    href="#sec-mit"    xlink:href="#sec-mit"/>

        <use id="hole-assess" data-spin="spin-assess" data-c="580 450" href="#geo-gl" xlink:href="#geo-gl"/>

    </mask>

    <path id="arcL" d="M510 587 A137 137 0 0 1 510 313"/>
    <path id="arcR" d="M1090 313 A137 137 0 0 1 1090 587"/>
    <!-- sweep windows for the arc lettering: a half-plane through the ring centre,

  <g id="hits">
    <use class="hit" href="#sec-idf" xlink:href="#sec-idf" data-lit="lb-idf"
         data-t="Cyber Risk Identification"
         data-d="Discovery and mapping of cyber risk across the digital ecosystem: vulnerabilities in systems, applications and processes, plus external threats and emerging risk. It rests on a continuous asset inventory that captures the relationships and interdependencies between assets, not merely a catalogue of what exists. Identification is not a static inventory. It is continuous exposure discovery, and it has to reach past what the organization owns to what it connects to and consumes."/>
    <use class="hit" href="#sec-ctx" xlink:href="#sec-ctx" data-lit="lb-ctx"
         data-t="Cyber Risk Contextualization"
         data-d="Risk without context is just noise. The same vulnerability or misconfiguration carries radically different consequences depending on where it sits and what it touches in the business. This is the stage that asks which process the component supports, what data it handles, what it can influence, and what the blast radius is if it fails or is abused. Context is what turns exposure into priority: it moves the question from what is vulnerable to what could truly hurt us, and why."/>
    <use class="hit" href="#sec-pri" xlink:href="#sec-pri" data-lit="lb-pri"
         data-t="Cyber Risk Prioritization"
         data-d="In most organizations this is where good intentions go to die, with teams drowning in alerts, vulnerability counts and control gaps. Treated as a continuous risk decision rather than a patching queue, the objective is not to fix everything but to reduce the risks that matter most to the business, fastest, with the greatest measurable impact. That means weighing technical severity against exploitability, business criticality, data sensitivity, exposure pathways and likely downstream impact. It is also where heatmaps fail."/>
    <use class="hit" href="#sec-mit" xlink:href="#sec-mit" data-lit="lb-mit"
         data-t="Cyber Risk Mitigation"
         data-d="Broader than remediation. Mitigation reduces exposure, likelihood, impact and uncertainty: sometimes patching, sometimes reconfiguring, sometimes guardrails, tighter permissions, hardened integrations or redesigned workflows so trust is not assumed where it should be verified. It is not about activity, it is about reduction. If reduced exposure, reduced consequence or reduced uncertainty cannot be demonstrated, the risk has not been mitigated."/>
    <use class="hit" href="#sec-ver" xlink:href="#sec-ver" data-lit="lb-ver"
         data-t="Cyber Risk Verification"
         data-d="The most overlooked stage. Teams assume that once an issue is fixed the risk is reduced, but controls are often partially deployed, inconsistently applied, bypassed by architecture or broken by change. Verification tests whether the mitigation actually moved the risk posture: did the exposure path close, did permissions shrink, did governance become enforceable. Exposure validation, control testing and adversarial simulation are how it is done. This is where the organization moves from assumption to evidence."/>
    <use class="hit" href="#sec-mon" xlink:href="#sec-mon" data-lit="lb-mon"
         data-t="Cyber Risk Monitoring"
         data-d="Monitoring closes the loop and restarts it. It is not passive logging but continuous awareness of changing exposure, changing business context and changing control effectiveness. What was low risk yesterday can be critical tomorrow because the surrounding context moved. Monitoring is the proof that the loop is alive: if risk cannot be observed continuously, it cannot be operated continuously."/>
    <use class="hit" href="#sec-croc" xlink:href="#sec-croc" data-lit="lb-croc"
         data-t="Cyber Risk Operations Center (CROC)"
         data-d="The operational nerve centre, and the outer ring for a reason: it is where risk is continuously observed, analysed, prioritized and acted upon. A traditional SOC monitors events. A CROC monitors risk, bringing telemetry, exposure intelligence, business context, scoring and operational decisions into one continuous cycle. It is what a mature organization needs when a SOC alone is no longer sufficient."/>
    <use class="hit" href="#sec-crem" xlink:href="#sec-crem" data-lit="lb-crem"
         data-t="Cyber Risk Exposure Management (CREM)"
         data-d="The layer that gives the organization the ability to understand exposure across the environment continuously, rather than in periodic snapshots. CREM makes exposure visible: which assets, identities, services and third-party dependencies are exposed, by what path, and how that picture is changing."/>
    <use class="hit" href="#sec-score" xlink:href="#sec-score" data-lit="lb-score"
         data-t="Continuous Cyber Risk Scoring &amp; Quantification"
         data-d="The measurement spine that runs around the whole loop. Scoring gives leaders a way to compare unlike risks in one operational language and track whether exposure is rising or falling. Quantification translates that into economic and business terms, so the conversation covers not only that a risk exists but what it would mean as disruption, financial impact or lost resilience. Scoring makes risk comparable. Quantification makes it intelligible to the board and the CFO."/>
    <use class="hit" href="#sec-assess" xlink:href="#sec-assess" data-lit="lb-assess"
         data-t="Continuous Cyber Risk Assessment"
         data-d="One of two gears in the same machine. Assessment continuously maps how the environment is changing, where exposure is increasing and which business processes are affected. It answers what is exposed and what it would cost us. Assessment without reduction becomes reporting."/>
    <use class="hit" href="#sec-reduce" xlink:href="#sec-reduce" data-lit="lb-reduce"
         data-t="Continuous Cyber Risk Reduction"
         data-d="The other gear. Reduction continuously translates that intelligence into action: architectural change, governance enforcement, control tuning and business protection. It answers what we changed and what it bought us. Reduction without assessment becomes guesswork."/>
    <use class="hit" href="#sec-core" xlink:href="#sec-core" data-lit="lb-core"
         data-t="CyberRiskOps"
         data-d="The connective tissue between strategy and execution, and the continuous operationalization of cyber risk. It turns risk management from a static process into a living system, driven by feedback loops rather than periodic review. The Cybersecurity Compass provides the strategic why, the CROC the operational where, and CyberRiskOps the process-driven how."/>

<script>
(function(){
  const svg = document.getElementById('loop'), stageEl = document.getElementById('stage');
  const read = document.getElementById('read');
  const els = [...svg.querySelectorAll('[data-from]')];
  const NAMES = ['',
    'cyber risk assessment and reduction',      // 1
    'cyber riskops, the hinge',                 // 2
    'continuous cyber risk, not periodic',      // 3
    'the cyber risk gears engage',              // 4
    'the cyber risk flow takes shape',          // 5
    'cyber risk identification and mitigation', // 6
    'the cyber risk loop closes',               // 7
    'the four cyber risk phases, named',        // 8
    'cyber risk scoring and quantification',    // 9
    'cyber risk exposure management (crem)',    // 10
    'cyber risk operations center (croc)'];     // 11       // 11
  const LAST = 11, GAP = 2000;
  let stage = 0, timer = null;

  function render(){
    els.forEach(el => {
      const from = +el.dataset.from, until = el.dataset.until ? +el.dataset.until : 99;
      el.classList.toggle('on', stage >= from && stage <= until);
    });
    svg.classList.toggle('st13',    stage <= 3);
    svg.classList.toggle('st46',    stage >= 4 && stage <= 6);
    svg.classList.toggle('two',     stage <= 2);
    svg.classList.toggle('tucked',  stage <= 6);
    svg.classList.toggle('st6',     stage >= 6);
    svg.classList.toggle('st8',     stage >= 8);
    svg.classList.toggle('st9',     stage >= 9);
    svg.classList.toggle('done',    stage >= LAST);
    if (stage < LAST) clearTip();
    svg.classList.toggle('running', stage >= 4);
    read.innerHTML = '<b>' + Math.max(stage,1) + ' / ' + LAST + '</b> &middot; ' + NAMES[Math.max(stage,1)];
  }
  function go(n){ stage = Math.max(0, Math.min(LAST, n)); render(); }
  function stop(){ clearTimeout(timer); timer = null; }
  function run(){
    stop();
    (function tick(){
      if (stage >= LAST) { timer = null; return; }
      go(stage + 1);
      timer = setTimeout(tick, GAP);
    })();
  }
  function replay(){ stop(); go(0); setTimeout(run, GAP); }   // blank canvas for one full beat before it rebuilds

  document.getElementById('next').addEventListener('click', e => { e.stopPropagation(); stop(); go(stage+1); });
  document.getElementById('prev').addEventListener('click', e => { e.stopPropagation(); stop(); go(stage-1); });
  document.getElementById('play').addEventListener('click', e => { e.stopPropagation(); replay(); });
  stageEl.addEventListener('click', () => { if (stage >= LAST) return; stop(); go(stage+1); });
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight'){ stop(); go(stage+1); }
    else if (e.key === 'ArrowLeft'){ stop(); go(stage-1); }
    else if (e.key === ' '){ e.preventDefault(); timer ? stop() : (stage >= LAST ? replay() : run()); }
    else if (e.key.toLowerCase() === 'r'){ replay(); }
  });

  /* ---- inspect mode, live at the last step ---- */
  const tip = document.getElementById('tip');
  const tipT = tip.querySelector('b'), tipD = tip.querySelector('span');
  const holes = [...document.querySelectorAll('#holes use')];
  let raf = null;
  function trackHole(u){
    cancelAnimationFrame(raf);
    const g = document.getElementById(u.dataset.spin);
    const c = u.dataset.c.split(' ');
    (function step(){
      const t = g && getComputedStyle(g).transform;
      let a = 0;
      if (t && t !== 'none'){
        const m = t.match(/-?[\d.e+-]+/g);
        if (m && m.length >= 4) a = Math.atan2(+m[1], +m[0]) * 180 / Math.PI;
      }
      u.setAttribute('transform', 'rotate(' + a.toFixed(2) + ' ' + c[0] + ' ' + c[1] + ')');
      raf = requestAnimationFrame(step);
    })();
  }
  function showHole(id){
    let tracking = false;
    holes.forEach(u => {
      const on = u.id === id;
      u.classList.toggle('on', on);
      // a gear-shaped hole follows the gear frame by frame: mask content is not
      // repainted on its own, so the angle is written in from the live element
      if (on && u.dataset.spin){ trackHole(u); tracking = true; }
    });
    if (!tracking){ cancelAnimationFrame(raf); raf = null; }
  }
  let lit = null;
  function clearTip(){
    if (!lit) return;
    lit = null; showHole(null);
    stageEl.classList.remove('dim');
    tip.classList.remove('show');
  }
  function place(e){
    const r = stageEl.getBoundingClientRect();
    let x = e.clientX - r.left + 16, y = e.clientY - r.top + 16;
    x = Math.min(x, r.width - 410); y = Math.min(y, r.height - 150);
    tip.style.left = Math.max(8, x) + 'px';
    tip.style.top  = Math.max(8, y) + 'px';
  }
  // one handler for the whole canvas: off a section is off, even in the black
  svg.addEventListener('pointermove', e => {
    if (stage < LAST) return;
    const hit = e.target.classList && e.target.classList.contains('hit') ? e.target : null;
    if (!hit){ clearTip(); return; }
    const ref = hit.getAttribute('href') || hit.getAttribute('xlink:href');
    if (lit !== ref){
      lit = ref;
      showHole('hole' + ref.replace('#sec',''));
      stageEl.classList.add('dim');
      tipT.textContent = hit.dataset.t;
      tipD.textContent = hit.dataset.d;
      tip.classList.add('show');
    }
    place(e);
  });
  svg.addEventListener('pointerleave', clearTip);

  render();
  setTimeout(run, 420);
})();
</script>
</body>
</html>
